```html
{% extends 'base.html' %}
{% block content %}
  <h2>Book Catalog</h2>
  {% if books %}
    <ul>
      {% for book in books %}
        <li><a href="{% url 'book_detail' book.pk %}">{{ book.title }}</a> by {{ book.author }} ({{ book.year }}) - ${{ book.price }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No books available.</p>
  {% endif %}
  <a href="{% url 'cart' %}">View Cart</a>
{% endblock %}
```
