<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>
</head>
<body>
    <h1>Your Cart</h1>
    {% if cart_items %}
        <ul>
            {% for item in cart_items %}
                <li>{{ item.book.title }} - Quantity: {{ item.quantity }} - Subtotal: ${{ item.subtotal }}</li>
            {% endfor %}
        </ul>
        <p>Total: ${{ total_price }}</p>
        <a href="{% url 'checkout' %}">Proceed to Checkout</a>
    {% else %}
        <p>Your cart is empty.</p>
    {% endif %}
    <a href="{% url 'book_list' %}">Continue Shopping</a>
</body>
</html>
